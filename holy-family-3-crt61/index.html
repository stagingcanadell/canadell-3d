<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 CRT61 with back and side rails | Staging Canadell 3D</title>
<meta name="robots" content="noindex, nofollow">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
<style>
  :root { --red:#c8102e; --ink:#2b2b2b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#fff; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:3px solid var(--red); }
  .brand { font-weight:900; letter-spacing:.5px; line-height:1; }
  .brand b { display:block; font-size:20px; }
  .brand small { display:block; font-size:9px; font-weight:700; color:var(--red); margin-top:3px; }
  .layout { padding:8px 14px 0; }
  .layout h1 { font-size:17px; margin:0; }
  .layout p { font-size:13px; margin:3px 0 0; color:#555; }
  model-viewer { width:100%; height:calc(100% - 200px); min-height:320px; background:#f3f3f3; --poster-color:#f3f3f3; }
  .ar-btn { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:var(--red); color:#fff;
            border:0; border-radius:26px; padding:13px 24px; font-size:16px; font-weight:700; box-shadow:0 2px 8px #0004; }
  .no-ar { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:13px; color:#555; }
  model-viewer[ar-status="session-started"] .no-ar, model-viewer[can-activate-ar] .no-ar { display:none; }
  footer { font-size:11px; color:#777; padding:8px 14px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>STAGING CANADELL</b><small>PORTABLE STAGING AND MUSIC RISER EXPERTS</small></div>
</header>
<div class="layout"><h1>3 CRT61 with back and side rails</h1><p>Designed for Holy Family &middot; 17'-5&quot; x 6'-8&quot;</p></div>

<!-- Model is real size in metres. ar-scale="fixed" stops customers resizing it in AR.
     ar-modes: Android -> Scene Viewer first (most reliable), WebXR fallback; iPhone -> Quick Look
     (uses model.usdz if given, otherwise model-viewer builds the USDZ on the phone). -->
<model-viewer src="model.glb" ios-src="model.usdz"
  alt="3D model of 3 CRT61 with back and side rails"
  ar ar-modes="scene-viewer webxr quick-look" ar-scale="fixed" ar-placement="floor"
  camera-controls touch-action="pan-y" shadow-intensity="1" exposure="0.85" tone-mapping="neutral"
  camera-orbit="-25deg 65deg 140%" field-of-view="30deg" environment-image="neutral">
  <button slot="ar-button" class="ar-btn">View in your space</button>
  <div class="no-ar">Open this page on a phone to place the model in your room.</div>
</model-viewer>
<footer>Shown at real size. Drag to rotate, pinch to zoom. &copy; Staging Canadell, Humboldt SK</footer>
</body>
</html>
